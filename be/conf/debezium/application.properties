debezium.source.connector.class=io.debezium.connector.sqlserver.SqlServerConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.database.hostname=host.docker.internal
debezium.source.database.port=1466
debezium.source.database.user=sa
debezium.source.database.password=IdcsPassword123!
debezium.source.database.names=IDCS
debezium.source.database.encrypt=false
debezium.source.database.trustServerCertificate=true
debezium.source.topic.prefix=idcs
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schemahistory.dat

# Sink configuration
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=rabbitmq
debezium.sink.rabbitmq.connection.port=5672
debezium.sink.rabbitmq.connection.username=guest
debezium.sink.rabbitmq.connection.password=guest
debezium.sink.rabbitmq.exchange=debezium_events
debezium.sink.rabbitmq.routingKey.source=topic
# Format configuration (MassTransit expects JSON without schema by default for UseRawJsonSerializer)
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false
