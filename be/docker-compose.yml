version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: edcl_sqlserver
    entrypoint: ["/opt/mssql/bin/sqlservr"]
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_MEMORY_LIMIT_MB: "1600"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "${SQL_SERVER_PORT}:1433"
    volumes:
      - sql_data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: edcl_redis
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: edcl_rabbitmq
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  edcl-api:
    build:
      context: .
      dockerfile: src/Host/EDCL.Api/Dockerfile
    container_name: edcl_api
    restart: on-failure
    depends_on:
      - sqlserver
      - redis
      - rabbitmq
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=edcl;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__IdcsDb=Server=host.docker.internal,1466;Database=IDCS;User Id=sa;Password=IdcsPassword123!;TrustServerCertificate=true;Encrypt=false;
      - ConnectionStrings__RedisConnection=redis:6379,abortConnect=false
      - ConnectionStrings__RabbitMqConnection=amqp://guest:guest@rabbitmq:5672/
      - ASPNETCORE_ENVIRONMENT=Development

  edcl-gateway:
    build:
      context: .
      dockerfile: src/Gateway/EDCL.Gateway/Dockerfile
    container_name: edcl_gateway
    restart: on-failure
    depends_on:
      - edcl-api
    environment:
      - ReverseProxy__Clusters__edcl-api-cluster__Destinations__destination1__Address=http://edcl-api:8080
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "${GATEWAY_PORT}:8080"

  edcl-worker-ingestion:
    build:
      context: .
      dockerfile: workers/EDCL.Worker.Ingestion/Dockerfile
    container_name: edcl_worker_ingestion
    restart: on-failure
    depends_on:
      - sqlserver
      - rabbitmq
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=edcl;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__IdcsDb=Server=host.docker.internal,1466;Database=IDCS;User Id=sa;Password=IdcsPassword123!;TrustServerCertificate=true;Encrypt=false;
      - ConnectionStrings__RabbitMqConnection=amqp://guest:guest@rabbitmq:5672/
      - DOTNET_ENVIRONMENT=Development

  edcl-worker-outbox:
    build:
      context: .
      dockerfile: workers/EDCL.Worker.Outbox/Dockerfile
    container_name: edcl_worker_outbox
    restart: on-failure
    depends_on:
      - sqlserver
      - rabbitmq
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=edcl;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__IdcsDb=Server=host.docker.internal,1466;Database=IDCS;User Id=sa;Password=IdcsPassword123!;TrustServerCertificate=true;Encrypt=false;
      - ConnectionStrings__RabbitMqConnection=amqp://guest:guest@rabbitmq:5672/
      - DOTNET_ENVIRONMENT=Development

  edcl-worker-reporter:
    build:
      context: .
      dockerfile: workers/EDCL.Worker.Reporter/Dockerfile
    container_name: edcl_worker_reporter
    restart: on-failure
    depends_on:
      - sqlserver
      - rabbitmq
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=edcl;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__IdcsDb=Server=host.docker.internal,1466;Database=IDCS;User Id=sa;Password=IdcsPassword123!;TrustServerCertificate=true;Encrypt=false;
      - ConnectionStrings__RabbitMqConnection=amqp://guest:guest@rabbitmq:5672/
      - DOTNET_ENVIRONMENT=Development

  debezium-server:
    image: quay.io/debezium/server:2.4
    container_name: edcl_debezium_server
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      JAVA_OPTS: "-Xms256m -Xmx256m"
    restart: on-failure
    depends_on:
      - sqlserver
      - rabbitmq
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: edcl_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: edcl_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090" # Prometheus Web UI & Query API
    volumes:
      - ./conf/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  sql_data:
  redis_data:
  rabbitmq_data:
  debezium_data:
  prometheus_data:
