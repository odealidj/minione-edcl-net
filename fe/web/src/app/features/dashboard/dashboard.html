<div class="space-y-6">
  <!-- Welcome Banner -->
  <div class="hero rounded-3xl overflow-hidden shadow-2xl relative bg-primary text-primary-content">
    <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center opacity-20 mix-blend-overlay"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-primary/90 to-transparent"></div>
    <div class="hero-content flex-col lg:flex-row p-10 lg:p-14 relative z-10 w-full justify-start">
      <div>
        <h1 class="text-4xl lg:text-5xl font-extrabold mb-4">Hello, Admin! 👋</h1>
        <p class="py-2 text-lg lg:text-xl max-w-2xl text-primary-content/90 font-light">
          Welcome to the Integrated Delivery Control System (EDCL). Monitor your fleet, plan routes, and manage master data seamlessly.
        </p>
        <div class="mt-6 flex gap-4">
          <button class="btn btn-neutral rounded-full px-8 shadow-xl" routerLink="/operations/monitoring">View Live Map</button>
          <button class="btn btn-outline btn-neutral rounded-full px-8 bg-white/10 border-white/20 hover:bg-white/20 text-white" routerLink="/master/driver">Manage Drivers</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    @for (stat of stats; track stat.title) {
      <div class="card bg-base-100 shadow-xl border border-base-200 hover:shadow-2xl transition-all hover:-translate-y-1">
        <div class="card-body flex-row items-center justify-between p-6">
          <div>
            <div class="text-base-content/60 font-medium mb-1">{{ stat.title }}</div>
            <div class="text-3xl font-bold text-base-content">{{ stat.value }}</div>
          </div>
          <div class="w-14 h-14 rounded-2xl flex items-center justify-center shadow-inner" [class]="stat.bg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" [class]="stat.color" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="stat.icon" />
            </svg>
          </div>
        </div>
      </div>
    }
  </div>
</div>
