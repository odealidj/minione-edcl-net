<div class="container mx-auto space-y-4">
  <app-page-header title="Logistic Partners" buttonText="Add New" (actionClick)="openModal()">
    <button *ngIf="selectedIds().size > 0" class="btn btn-error" (click)="deleteSelected()" [disabled]="isDeletingSelected()">
      @if (isDeletingSelected()) { <span class="loading loading-spinner loading-sm"></span> }
      Delete Selected ({{ selectedIds().size }})
    </button>
  </app-page-header>

  <app-card>
    <app-search-bar placeholder="Search..." (search)="onSearch($event)"></app-search-bar>
    <table class="table w-full">
      <thead>
        <tr class="bg-base-200/50 text-base-content/50 uppercase text-xs">
          <th class="w-12 text-center align-middle">
            <label class="cursor-pointer flex items-center justify-center">
              <input type="checkbox" class="checkbox checkbox-sm checkbox-primary rounded" (change)="toggleAll($event)" [checked]="isAllSelected()">
            </label>
          </th>
          <th>Code</th>
          <th>Name</th>
          <th>GPS Vendors</th>
          <th class="w-24 text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        @if (isLoading()) {
          <tr><td colspan="5" class="text-center py-8"><span class="loading loading-spinner loading-lg text-primary"></span></td></tr>
        } @else if (items().length === 0) {
          <tr><td colspan="5" class="text-center py-8 text-base-content/50">No data found.</td></tr>
        } @else {
          @for (item of items(); track item.id) {
            <tr class="hover:bg-base-200/50 transition-colors">
              <td class="text-center align-middle">
                <label class="cursor-pointer flex items-center justify-center">
                  <input type="checkbox" class="checkbox checkbox-sm checkbox-primary rounded" (change)="toggleSelection(item.id)" [checked]="isSelected(item.id)">
                </label>
              </td>
              <td>{{ item.code }}</td>
              <td>{{ item.name }}</td>
              <td class="text-xs text-base-content/80">{{ getVendorNames(item.gpsVendorIds) }}</td>
              <td class="text-center">
                <div class="join">
                  <button class="btn btn-sm btn-ghost join-item text-info" (click)="openModal(item)">Edit</button>
                  <button class="btn btn-sm btn-ghost join-item text-error" (click)="deleteItem(item.id)">Delete</button>
                </div>
              </td>
            </tr>
          }
        }
      </tbody>
    </table>
  </app-card>

  <app-pagination 
    [meta]="meta()" 
    [currentItemsCount]="items().length" 
    (pageChange)="changePage($event)"
    (pageSizeChange)="changePageSize($event)">
  </app-pagination>
</div>

<!-- Modal -->
<dialog #crudModal class="modal">
  <div class="modal-box">
    <h3 class="font-bold text-lg mb-4">{{ isEditMode ? 'Edit' : 'Add' }} Logistic Partner</h3>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="space-y-4">
        <div class="form-control w-full">
          <label class="label"><span class="label-text">Code</span></label>
          <input type="text" formControlName="code" class="input input-bordered w-full" placeholder="Enter Code" />
        </div>
        <div class="form-control w-full">
          <label class="label"><span class="label-text">Name</span></label>
          <input type="text" formControlName="name" class="input input-bordered w-full" placeholder="Enter Name" />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">GPS Vendors</span></label>
          <select formControlName="gpsVendorIds" class="select select-bordered w-full h-32" multiple>
            @for (vendor of gpsVendors(); track vendor.id) {
              <option [ngValue]="vendor.id">{{ vendor.name }}</option>
            }
          </select>
          <label class="label"><span class="label-text-alt">Hold Ctrl/Cmd to select multiple</span></label>
        </div>
      </div>
      <div class="modal-action mt-6">
        <button type="button" class="btn btn-ghost" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="isSaving || form.invalid">
          @if (isSaving) { <span class="loading loading-spinner loading-sm"></span> }
          Save
        </button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button (click)="closeModal()">close</button>
  </form>
</dialog>
